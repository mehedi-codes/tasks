services:
  - type: web
    name: tasks
    runtime: node
    plan: free
    buildCommand: bun install --ignore-scripts && bun run build
    startCommand: bun run start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: BETTER_AUTH_SECRET
        generateValue: true
      - key: BETTER_AUTH_URL
        value: https://tasks.mehedi.engineer
      - key: BETTER_AUTH_TRUSTED_ORIGINS
        value: https://tasks.mehedi.engineer
      - key: LOG_LEVEL
        value: info
